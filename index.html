<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<style>
  :root {
    --ink: #12181f;
    --paper: #eef0eb;
    --line: #2a333b;
    --accent: #f2b544;
    --bubble-user: #1f2831;
    --bubble-ai: #171e25;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  header h1 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 82%;
    padding: 12px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border: 1px solid var(--line);
  }
  .msg.pending {
    color: #7d8891;
  }
  .msg.error {
    background: #3a1f1f;
    border: 1px solid #6b3b3b;
    color: #eecccc;
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px 20px;
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--bubble-ai);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--paper);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.4;
    max-height: 140px;
  }
  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    background: var(--accent);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #empty {
    margin: auto;
    text-align: center;
    color: #5f6b71;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dot"></div>
    <h1>Notes</h1>
  </header>
  <div id="thread">
    <div id="empty">Ask anything to get started.</div>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message..." autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const thread = document.getElementById('thread');
  const empty = document.getElementById('empty');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  function addBubble(role, text, cls) {
    if (empty.parentNode) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (cls || role);
    div.textContent = text;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    return div;
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const pending = addBubble('ai', 'Thinking…', 'ai pending');

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: history
        })
      });

      if (!response.ok) throw new Error('Request failed: ' + response.status);

      const data = await response.json();
      const textBlocks = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n');

      pending.textContent = textBlocks || '(no response)';
      pending.className = 'msg ai';
      history.push({ role: 'assistant', content: textBlocks });
    } catch (err) {
      pending.textContent = 'Something went wrong — please try again.';
      pending.className = 'msg error';
      history.pop();
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
